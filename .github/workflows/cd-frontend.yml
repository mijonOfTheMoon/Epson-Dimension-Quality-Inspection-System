name: Build and Deploy Frontend to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - frontend/**

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-frontend.yml

  build-and-run:
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Login to Container Registry
        uses: docker/login-action@v3.5.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_SERVICE }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_APP_TIMEZONE=${{ vars.VITE_APP_TIMEZONE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.10
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}

      - name: 'Deploy Frontend to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2.7.3'
        with:
          service: ${{ vars.FRONTEND_SERVICE }}
          region: ${{ vars.REGION }}
          image: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_SERVICE }}@${{ steps.build-and-push.outputs.digest }}
          flags: --port=8080