services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: diminspect-postgres:latest
    container_name: diminspect-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=diminspect"]
    environment:
      POSTGRES_DB: diminspect
      POSTGRES_USER: diminspect
      POSTGRES_PASSWORD: diminspect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diminspect -d diminspect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx:
    image: emqx/emqx:5.8
    container_name: diminspect-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: "${EMQX_NODE_COOKIE:-diminspect-secret-cookie}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:-public}"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: diminspect-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORE_ACCESS_KEY_ID:-diminspect}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORE_SECRET_ACCESS_KEY:-diminspect-secret}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: diminspect-backend:latest
    container_name: diminspect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGIN: "http://localhost"
      DATABASE_URL: postgresql://diminspect:diminspect@postgres:5432/diminspect
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: 10
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
      JWT_EXPIRES_IN: "7d"
      BCRYPT_ROUNDS: 10
      VIDEO_TRANSPORT: "${VIDEO_TRANSPORT:-ws}"
      MQTT_HOST: "${MQTT_HOST:-emqx}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-diminspect}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-diminspect}"
      MQTT_TOPIC_PREFIX: "${MQTT_TOPIC_PREFIX:-diminspect/development}"
      MQTT_USE_TLS: "${MQTT_USE_TLS:-false}"
      MQTT_WS_HOST: "${MQTT_WS_HOST:-localhost}"
      MQTT_RETAINED_PRESENCE_TIMEOUT_MS: "${MQTT_RETAINED_PRESENCE_TIMEOUT_MS:-2000}"
      CLOUDFLARE_REALTIME_ENABLED: "${CLOUDFLARE_REALTIME_ENABLED:-false}"
      CLOUDFLARE_REALTIME_APP_ID: "${CLOUDFLARE_REALTIME_APP_ID:-}"
      CLOUDFLARE_REALTIME_APP_SECRET: "${CLOUDFLARE_REALTIME_APP_SECRET:-}"
      CLOUDFLARE_REALTIME_API_BASE_URL: "${CLOUDFLARE_REALTIME_API_BASE_URL:-https://rtc.live.cloudflare.com/v1}"
      OBJECT_STORE_ENABLED: "${OBJECT_STORE_ENABLED:-true}"
      OBJECT_STORE_BUCKET: "${OBJECT_STORE_BUCKET:-diminspect-frames}"
      OBJECT_STORE_ENDPOINT: "${OBJECT_STORE_ENDPOINT:-http://minio:9000}"
      OBJECT_STORE_PUBLIC_ENDPOINT: "${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9000}"
      OBJECT_STORE_REGION: "${OBJECT_STORE_REGION:-us-east-1}"
      OBJECT_STORE_FORCE_PATH_STYLE: "${OBJECT_STORE_FORCE_PATH_STYLE:-true}"
      OBJECT_STORE_ACCOUNT_ID: "${OBJECT_STORE_ACCOUNT_ID:-}"
      OBJECT_STORE_ACCESS_KEY_ID: "${OBJECT_STORE_ACCESS_KEY_ID:-diminspect}"
      OBJECT_STORE_SECRET_ACCESS_KEY: "${OBJECT_STORE_SECRET_ACCESS_KEY:-diminspect-secret}"
      OBJECT_STORE_SIGNED_URL_TTL_SECONDS: "${OBJECT_STORE_SIGNED_URL_TTL_SECONDS:-86400}"
      OBJECT_STORE_UPLOAD_TIMEOUT_SECONDS: "${OBJECT_STORE_UPLOAD_TIMEOUT_SECONDS:-10}"
    expose:
      - "4000"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: diminspect-frontend:latest
    container_name: diminspect-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_PASS: http://backend:4000
    expose:
      - "8080"

  proxy:
    image: nginx:1.28-alpine
    container_name: diminspect-proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  emqx-data:
  minio-data:
